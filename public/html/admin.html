<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notely - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>
    <header class="topbar">
        <a href="home.html" class="logo">
            <img src="../png/Notely Icon.png" alt="Notely Icon">
            <span>Notely</span>
        </a>

        <div class="welcome">
            <h1>ยินดีต้อนรับสู่ห้อง admin</h1>
            <p>คุณ ...</p>
        </div>

        <div class="profile">
            <a href="#" class="email">idk@gmail.com</a>
        </div>
    </header>

    <div class="layout">
        <main class="content">
            <section class="block">
                <div class="block-head">
                    <h2>ข้อมูลผู้ใช้</h2>
                    <label class="search">
                        <img src="../png/Search icon.png" alt="">
                        <input type="text" placeholder="ค้นหา Username Gmail ผู้ใช้">
                    </label>
                </div>

                <div class="table-card">
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Gmail</th>
                                <th>ประเภทผู้ใช้</th>
                                <th>Block acc</th>
                                <th>Delete acc</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- เว้นว่างไว้ใส่ข้อมูลผู้ใช้ทีหลัง -->
                        </tbody>
                    </table>
                </div>
            </section>

            <div class="reports">
                <section class="block">
                    <div class="block-head">
                        <h2>รายงานโน้ต</h2>
                        <label class="search">
                            <img src="../png/Search icon.png" alt="">
                            <input type="text" placeholder="ค้นหารายงานโน้ต">
                        </label>
                    </div>

                    <div class="panel">
                    </div>
                </section>

                <section class="block">
                    <div class="block-head">
                        <h2>รายงานผู้ใช้</h2>
                        <label class="search">
                            <img src="../png/Search icon.png" alt="">
                            <input type="text" placeholder="ค้นหารายงานผู้ใช้งาน">
                        </label>
                    </div>

                    <div class="panel">
                    </div>
                </section>

                <section class="block wide">
                    <div class="block-head">
                        <h2>รายงาน Comment</h2>
                        <label class="search">
                            <img src="../png/Search icon.png" alt="">
                            <input type="text" placeholder="ค้นหารายงานโน้ต">
                        </label>
                    </div>

                    <div class="panel">
                    </div>
                </section>

            </div>
        </main>

        <nav class="side" aria-label="เมนูแอดมิน">
            <a href="#" class="side-item"><span class="ico">👤</span><span>You</span></a>
            <a href="#" class="side-item"><span class="ico">👥</span><span>Users</span></a>
            <a href="#" class="side-item"><span class="ico">📝</span><span>Content</span></a>
            <a href="#" class="side-item"><span class="ico">📋</span><span>Logs</span></a>
            <a href="#" class="side-item settings"><span class="ico">⚙️</span><span>Settings</span></a>
        </nav>

    </div>

<script src="../js/admin.js"></script>    
</body>

</html>
