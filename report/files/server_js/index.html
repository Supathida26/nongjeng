</div>

    </div>
    <div class="col-md-6">

      <div id="fn-by-sloc" class="stat"></div>
    </div>
  </div>
</div>

<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const express = require(&#039;express&#039;);
const cors = require(&#039;cors&#039;);
const path = require(&#039;path&#039;);
require(&#039;dotenv&#039;).config();

// Import Routes
const userRoutes = require(&#039;./routes/loginRoute&#039;);
const postRoutes = require(&#039;./routes/postRoute&#039;);
const adminRoutes = require(&#039;./routes/adminRoute&#039;);
const reportRoutes = require(&#039;./routes/reportRoute&#039;);

const app = express();

app.use(cors());
app.use(express.json());
app.use(express.urlencoded({ extended: true })); // รองรับการส่งข้อมูลจาก &lt;form&gt; ใน HTML

// เปิดให้เข้าถึงไฟล์ HTML/CSS/JS ใน public และไฟล์ที่อัปโหลดใน uploadFiles
app.use(express.static(path.join(__dirname, &#039;public&#039;)));
app.use(&#039;/uploadFiles&#039;, express.static(path.join(__dirname, &#039;uploadFiles&#039;)));

// เมื่อเข้าหน้าแรก http://localhost:3000 ให้พาไปหน้า home.html อัตโนมัติ
app.get(&#039;/&#039;, (req, res) =&gt; {
    res.redirect(&#039;/html/home.html&#039;);
});

// ใช้งาน Route
app.use(&#039;/api/users&#039;, userRoutes);
app.use(&#039;/api/posts&#039;, postRoutes);
app.use(&#039;/api/admin&#039;, adminRoutes);
app.use(&#039;/api/reports&#039;, reportRoutes);

const PORT = process.env.PORT || 3000;
app.listen(PORT, () =&gt; console.log(`Server running on http://localhost:${PORT}`));</textarea>
  </div>
</div>
