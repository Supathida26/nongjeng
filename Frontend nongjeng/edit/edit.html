<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notely - Edit Note</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="edit.css">
</head>

<body>
    <iframe class="backdrop" src="../home/home.html" title="" tabindex="-1" aria-hidden="true"></iframe>

    <main class="modal">

        <header class="modal-head">
            <div>
                <span class="eyebrow">Create new note</span>
                <h1>แก้ไขโน้ตของคุณ</h1>
            </div>
            <a href="../home/home.html" class="close" aria-label="ปิด">✕</a>
        </header>

        <form class="form" action="#" method="post" enctype="multipart/form-data">

            <label class="field">
                <span>ชื่อโน้ต</span>
                <input type="text" name="title" required>
            </label>

            <div class="row">
                <label class="field">
                    <span>วิชา</span>
                    <select name="subject">
                        <option>คณิตศาสตร์</option>
                        <option>ชีววิทยา</option>
                        <option>อังกฤษ</option>
                        <option>พระพุทธศาสนา</option>
                    </select>
                </label>

                <label class="field">
                    <span>แท็ก</span>
                    <input type="text" name="tags" class="tags-input" placeholder="#ตามประเภทโน้ตของคุณ">
                </label>
            </div>

            <label class="field">
                <span>รายละเอียด</span>
                <textarea name="detail" rows="4" placeholder="เล่ารายละเอียดให้ฟังว่าโน้ตของคุณเกี่ยวกับอะไร"></textarea>
            </label>
            <label class="preview" title="แก้ไขไฟล์">
                <input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                <img class="upload-icon" src="../upload Icon.png" alt="แก้ไขไฟล์">
            </label>

            <button type="submit" class="btn-share">เผยแพร่โน้ต →</button>
        </form>

    </main>

</body>

</html>
